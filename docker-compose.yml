# Kaushal Parinam (docs/02-TRD.md §8, §13).
#
#   docker compose up --build
#   docker compose exec web python manage.py seed_demo --trainees 500
#   docker compose exec web python manage.py generate_stats
#
# The `web` service runs gunicorn; `manage.py runserver` is no longer the
# container command. The entrypoint applies migrations and collects static
# files on start, so `docker compose up` is enough to get a working instance.
#
# `compose.production.yml` is the deployable variant: DEBUG off, a real secret
# key, HTTPS-only cookies and HSTS. This file is the demo configuration.
#
# On DATABASE_URL: these use the `postgres` superuser for simplicity. That role
# bypasses row-level security, which for this project is the documented state of
# affairs anyway (README section 5) -- the policies cannot constrain a Django ORM
# because INSERT ... RETURNING is rejected by them. If you want to exercise the
# policies, run docker/bootstrap-roles.sql and point DATABASE_URL at kp_app, but
# expect writes to fail.
services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@db:5432/kaushal_parinam}
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - DJANGO_TIME_ZONE=Asia/Kolkata
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-demo-key}
    volumes:
      # Demo only: live-reloads code edits. compose.production.yml drops this.
      - .:/app
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=kaushal_parinam
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kaushal_parinam"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The follow-up scheduler. Stateless and safe to scale: it claims jobs with
  # SELECT ... FOR UPDATE SKIP LOCKED, so two of these will not double-send
  # (docs/02-TRD.md §1).
  scheduler:
    build: .
    command: python manage.py run_followup_scheduler --loop --interval 60
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@db:5432/kaushal_parinam}
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - DJANGO_TIME_ZONE=Asia/Kolkata
      - SECRET_KEY=${SECRET_KEY:-django-insecure-docker-demo-key}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Redis is optional and NOT required: the follow-up scheduler uses a
  # PostgreSQL job table with FOR UPDATE SKIP LOCKED (docs/02-TRD.md §1).
  # redis:
  #   image: redis:7
  #   ports:
  #     - "6379:6379"

volumes:
  pg_data:
  static_data: