# Render Infrastructure as Code Blueprint
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: kaushal-parinam-backend
    runtime: python
    region: frankfurt # or singapore / oregon
    plan: free
    buildCommand: "./docker/entrypoint.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 60"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: DJANGO_TIME_ZONE
        value: "Asia/Kolkata"
      - key: DJANGO_ENV
        value: "production"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,*.vercel.app,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://*.vercel.app"
      - key: DATABASE_URL
        fromDatabase:
          name: kaushal-parinam-db
          property: connectionString

databases:
  - name: kaushal-parinam-db
    plan: free
    region: frankfurt
    databaseName: kaushal_parinam
    user: kaushal_user
